openapi: 3.0.3
info:
  title: notification-service API
  version: 1.0.0
  description: Управление уведомлениями и настройками

servers:
  - url: http://localhost:8084

tags:
  - name: notifications
    description: История уведомлений
  - name: preferences
    description: Настройки уведомлений клиента

paths:
  /api/v1/notifications:
    get:
      operationId: getNotifications
      summary: История уведомлений клиента
      tags:
        - notifications
      parameters:
        - name: clientId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Страница уведомлений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPageResponse'

  /api/v1/preferences/{clientId}:
    get:
      operationId: getPreferences
      summary: Получить настройки уведомлений клиента
      tags:
        - preferences
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Настройки клиента
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PreferenceResponse'
        '404':
          description: Настройки не найдены

    put:
      operationId: updatePreferences
      summary: Обновить настройки уведомлений клиента
      tags:
        - preferences
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PreferenceRequest'
      responses:
        '200':
          description: Настройки обновлены
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PreferenceResponse'

components:
  schemas:
    NotificationPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/NotificationResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    NotificationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        channel:
          type: string
          enum: [EMAIL, SMS, PUSH]
        subject:
          type: string
        body:
          type: string
        status:
          type: string
          enum: [PENDING, SENT, FAILED]
        paymentId:
          type: string
          format: uuid
        sentAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    PreferenceRequest:
      type: object
      required:
        - channel
        - enabled
      properties:
        channel:
          type: string
          enum: [EMAIL, SMS, PUSH]
        enabled:
          type: boolean

    PreferenceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        channel:
          type: string
          enum: [EMAIL, SMS, PUSH]
        enabled:
          type: boolean
        updatedAt:
          type: string
          format: date-time